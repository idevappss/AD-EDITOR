<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ATLAS Ad Editor</title>
    <link rel="icon" href="/brand/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="nt" id="nt">
      <a href="#/ads" class="nt-brand" aria-label="ATLAS Ad Editor home">
        <svg class="nt-logo" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><defs><linearGradient id="ntg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffab4a" /><stop offset="1" stop-color="#ef5a17" /></linearGradient></defs><path d="M12 2 22.5 21.5h-5.6L12 12.2 7.1 21.5H1.5z" fill="url(#ntg)" /><path d="M12 12.2 9.4 17.1h5.2z" fill="#fff" opacity=".9" /></svg>
        <span>ATLAS</span>
      </a>
      <nav class="nt-links" id="nt-links" aria-label="Main">
        <a href="#/ads" data-nav="ads">Ad studio</a>
        <a href="#/my-ads" data-nav="my-ads">My ads</a>
        <a href="#/assets" data-nav="assets">Assets</a>
        <span class="nt-ink" id="nt-ink" aria-hidden="true"></span>
      </nav>
      <div class="nt-end">
        <div class="search" id="search">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5" /><path d="m20 20-4.2-4.2" /></svg>
          <input id="search-input" type="search" autocomplete="off" placeholder="Search ads or pages…" />
          <kbd>⌘ K</kbd>
          <div class="search-results" id="search-results" hidden></div>
        </div>
        <span id="engine" class="engine"></span>
        <div class="nt-me">
          <button type="button" class="nt-me-btn" id="nt-me-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="nt-pop" title="Account and more">
            <span class="top-avatar" id="top-avatar">AD</span>
            <svg class="nt-caret" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m7 10 5 5 5-5" /></svg>
          </button>
          <div class="nt-pop" id="nt-pop" role="menu" hidden>
            <div class="credits-card">
              <a class="credits-bolt" href="/api/integrations/" title="Manage credits"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M13 3 5 13.5h6L10 21l8-10.5h-6z" fill="currentColor" /></svg></a>
              <span id="credits"></span>
              <div class="credits-bar" id="credits-bar" hidden><i></i></div>
            </div>
            <a role="menuitem" href="#/sounds" data-nav="sounds"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12" /><circle cx="6.5" cy="18" r="2.5" /><circle cx="16.5" cy="16" r="2.5" /></svg>Sounds</a>
            <a role="menuitem" href="#/study" data-nav="study"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2" /><path d="M8 5v14" /></svg>Study</a>
            <a role="menuitem" href="#/analytics" data-nav="analytics"><svg viewBox="0 0 24 24"><path d="M4 19.5V14m5 5.5V8m5 11.5v-7m5 7V5" /></svg>Analytics</a>
            <a role="menuitem" href="#/memory" data-nav="memory"><svg viewBox="0 0 24 24"><path d="M9 4.5a3 3 0 0 0-3 3v.2A3 3 0 0 0 4.5 13a3 3 0 0 0 1.8 4.5A3 3 0 0 0 12 18.5V6a1.5 1.5 0 0 0-3-1.5z" /><path d="M15 4.5a3 3 0 0 1 3 3v.2a3 3 0 0 1 1.5 5.3 3 3 0 0 1-1.8 4.5A3 3 0 0 1 12 18.5" /></svg>Memory</a>
            <hr />
            <a role="menuitem" href="/api/integrations/"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 3.5v2.5M12 18v2.5M3.5 12H6M18 12h2.5M6 6l1.8 1.8M16.2 16.2 18 18M6 18l1.8-1.8M16.2 7.8 18 6" /></svg>Integrations</a>
          </div>
        </div>
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Menu" aria-controls="nt-links"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16" /></svg></button>
      </div>
    </header>
    <main id="app"></main>
    <div class="scrim" id="scrim"></div>

    <div id="toast" class="toast" hidden></div>
    <script src="/vendor/hyperframes-player.js"></script>
    <script type="module" src="/api/music/ui/music.js"></script>
    <script type="module" src="/api/integrations/ui/credits.js"></script>
    <script type="module" src="/shell.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
